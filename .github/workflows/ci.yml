name: Java CI with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Grant execute permission for Maven Wrappers
        run: chmod +x gas-station-service/mvnw pricing-service/mvnw

      - name: Start PostgreSQL databases (db_gas_station & db_pricing)
        run: |
          docker compose up -d postgres-gas-station postgres-pricing
          for i in $(seq 1 30); do
            if docker compose exec -T postgres-gas-station pg_isready -U postgres -d db_gas_station \
               && docker compose exec -T postgres-pricing pg_isready -U postgres -d db_pricing; then
              break
            fi
            sleep 1
          done

      - name: Build and test gas-station-service
        working-directory: gas-station-service
        run: ./mvnw clean verify

      - name: Build and test pricing-service
        working-directory: pricing-service
        run: ./mvnw clean verify

      - name: Tear down Docker Compose services
        if: always()
        run: docker compose down
